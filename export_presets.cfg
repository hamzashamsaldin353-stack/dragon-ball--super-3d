name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Install export templates
        run: |
          mkdir -p /home/runner/.local/share/godot/export_templates
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates /home/runner/.local/share/godot/export_templates/4.6.stable

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Keystore & Export Presets
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server_visibility_mode=0
          advanced_options=false
          script_export_mode=1
          script_encryption_key=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/dragon-super-3d.apk"

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          antialiasing/msaa_2d=0
          antialiasing/msaa_3d=0
          antialiasing/screen_space_roughness_limiter=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.example.dragonsuper3d"
          package/name="Dragon Super 3D"
          package/signed=true
          keystore/debug="$GITHUB_WORKSPACE/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/dragon-super-3d.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dragon-super-3d-apk
          path: build/dragon-super-3d.apk
