name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false

      - name: Install export templates
        run: |
          mkdir -p /home/runner/.local/share/godot/export_templates
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates /home/runner/.local/share/godot/export_templates/4.6.stable

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Debug Keystore & Configure Godot Settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p /home/runner/.config/godot/
          echo '[export/android]' > /home/runner/.config/godot/editor_settings-4.4.godot
          echo 'android_sdk_path = "'$ANDROID_HOME'"' >> /home/runner/.config/godot/editor_settings-4.4.godot
          echo 'debug_keystore = "'$GITHUB_WORKSPACE'/debug.keystore"' >> /home/runner/.config/godot/editor_settings-4.4.godot
          echo 'debug_keystore_user = "androiddebugkey"' >> /home/runner/.config/godot/editor_settings-4.4.godot
          echo 'debug_keystore_pass = "android"' >> /home/runner/.config/godot/editor_settings-4.4.godot

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/dragon-super-3d.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dragon-super-3d-apk
          path: build/dragon-super-3d.apk
